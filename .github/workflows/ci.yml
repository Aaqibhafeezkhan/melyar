name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libmpv-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path core_rs/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path core_rs/Cargo.toml --release

  web-ui:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # pnpm 10+ is required: the project uses the `allowBuilds` setting
          # in pnpm-workspace.yaml to permit esbuild's postinstall script.
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui_web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  desktop-app:
    name: Desktop app (Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-webengine-dev qt6-webchannel-dev \
            libmpv-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev debhelper fakeroot build-essential \
            cmake pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-webengine-dev qt6-webchannel-dev \
            libmpv-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build the package
        # The dependency check is skipped because rustc and cargo come from
        # rustup, which dpkg does not know about. Every other build
        # dependency is installed above.
        run: dpkg-buildpackage -d -us -uc -b

      - name: Check the package
        run: |
          DEB=$(ls ../melyar_*_amd64.deb)
          ls -la "$DEB"
          dpkg-deb --info "$DEB"
          # sed instead of head: head closes the pipe and makes tar fail.
          dpkg-deb --contents "$DEB" | sed -n '1,20p'

      - name: Free the disk
        # The Rust build tree is several gigabytes and the runner does not
        # have the room to unpack the package next to it.
        run: |
          rm -rf build target
          sudo apt-get clean
          df -h /

      - name: Unpack the package and check the files
        # Unpacking does not resolve the dependencies, so it works without
        # the runtime Qt packages being on the runner.
        run: |
          rm -rf package-root
          mkdir package-root
          DEB=$(ls ../melyar_*_amd64.deb)
          dpkg-deb -x "$DEB" package-root
          test -x package-root/usr/bin/melyar
          test -f package-root/usr/share/melyar/web/index.html
          test -f package-root/usr/share/applications/melyar.desktop
          test -f package-root/usr/share/icons/hicolor/scalable/apps/melyar.svg
          ls package-root/usr/share/melyar/web

      - name: Upload the package
        run: cp ../melyar_*_amd64.deb .

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: melyar_*.deb
          if-no-files-found: error
